name: Refresh screenshot baselines

# Screenshot baselines must come from the Chromium build that CI uses (Playwright pins it),
# otherwise font rasterisation differs by a few percent and the comparison fails. Run this
# workflow on a branch after an intended visual change; it commits the refreshed baselines
# under tests/e2e/__screenshots__ to that branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate and commit baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Regenerate baselines
        run: pnpm exec playwright test --update-snapshots --grep "looks right"
      - name: Commit baselines
        run: |
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh screenshot baselines from CI's Chromium" -m "Generated by the screenshots workflow on ${{ github.ref_name }}."
          git push
