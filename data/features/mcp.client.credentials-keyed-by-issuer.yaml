id: mcp.client.credentials-keyed-by-issuer
name: "Credentials stored per issuer"
description: >
  The client stores registered client credentials keyed by the authorization server issuer rather
  than by MCP server URL, so one registration serves every resource behind that issuer.
category: registration
party: client
observable: manual
revisions:
  - spec: mcp-authorization
    revision: "2026-07-28"
    section: "Client Registration › Credential Storage"
    level: MUST
