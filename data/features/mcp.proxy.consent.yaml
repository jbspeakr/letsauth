id: mcp.proxy.consent
name: "Per-client consent on proxy servers"
description: >
  An MCP server that acts as a proxy with a static upstream client id obtains the user's consent
  for each dynamically registered client before forwarding.
category: consent
party: mcp-server
observable: manual
