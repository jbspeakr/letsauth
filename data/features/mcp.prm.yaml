id: mcp.prm
name: "Protected Resource Metadata served"
description: >
  The MCP server publishes an OAuth 2.0 Protected Resource Metadata document (RFC 9728) that tells
  clients which authorization servers protect it.
category: discovery
party: mcp-server
observable: passive
revisions:
