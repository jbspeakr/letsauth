    revision: "2025-11-25"
    section: "Authorization Server Discovery › Authorization Server Location"
    level: MUST
  - spec: mcp-authorization
    revision: "2026-07-28"
    section: "Authorization Server Discovery › Authorization Server Location"
    level: MUST
