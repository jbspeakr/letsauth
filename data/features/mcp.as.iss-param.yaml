id: mcp.as.iss-param
name: "Issuer identifier in authorization responses"
description: >
  The authorization server returns the iss parameter on authorization responses (RFC 9207) and
  advertises authorization_response_iss_parameter_supported: true.
category: authorization
party: authorization-server
observable: passive
