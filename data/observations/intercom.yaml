  evidence: 'https://developers.intercom.com/docs/guides/mcp — "This names the application asking to connect, lists what it will be able to do in your workspace, and shows its Client ID and the address it redirects to after you approve. [...] This asks you to authorize access for Intercom MCP, the server, rather than for the application." (Two screens: the Intercom MCP consent page for the dynamically registered client, then Intercom''s own authorization screen for the MCP server''s upstream client. Docs add that the application name is supplied by the application and not verified by Intercom.)'
