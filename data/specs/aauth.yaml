id: aauth
name: "AAuth Protocol"
body: ietf-oauth
family: protocol
maturity: individual-draft
maturityNote: "Individual Internet-Draft; not adopted by a working group"
summary: >
  An agent-first authorization and identity-claim protocol with several access modes, built on
  HTTP message signatures and published keys rather than on the OAuth authorization code flow.
url: https://datatracker.ietf.org/doc/draft-hardt-oauth-aauth-protocol/
