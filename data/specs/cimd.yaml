id: cimd
name: "OAuth Client ID Metadata Document"
body: ietf-oauth
family: discovery
maturity: working-group-draft
maturityNote: "Working group document, intended Standards Track"
summary: >
  Lets a client use an HTTPS URL as its client_id; the authorization server fetches the metadata
  document at that URL instead of requiring prior or dynamic registration.
url: https://datatracker.ietf.org/doc/draft-ietf-oauth-client-id-metadata-document/
