id: id-jag
name: "Identity Assertion JWT Authorization Grant"
body: ietf-oauth
family: protocol
maturity: working-group-draft
maturityNote: "Working group document, intended Standards Track; known informally as Cross-App Access"
summary: >
  Lets an application present the identity assertion it got from the enterprise identity
  provider to obtain, through that provider, an access token for a third-party API, so the
  enterprise stays in control of which apps may talk to which.
url: https://datatracker.ietf.org/doc/draft-ietf-oauth-identity-assertion-authz-grant/
